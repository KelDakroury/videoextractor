name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: >
          python -m py_compile
          webapp.py
          video_service.py
          mediascrapers.py
          util/network.py
          util/url.py
          util/file.py
          util/media.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  container-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build --tag videoextractor:test .

      - name: Start container
        run: >
          docker run
          --detach
          --name videoextractor-test
          --publish 8000:8000
          videoextractor:test

      - name: Verify health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs videoextractor-test
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force videoextractor-test
